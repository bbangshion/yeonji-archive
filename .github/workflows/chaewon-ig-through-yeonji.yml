name: CHAEWON PHOTO - use YEONJI Instagram secret (export)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'discover: review candidates / publish: export verified photos'
        required: true
        default: discover
        type: choice
        options:
          - discover
          - publish
      max_pages:
        description: 'Official @triplescosmos pages to scan (50 posts per page)'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '5'
          - '10'
          - '20'
      media_ids:
        description: 'publish only: comma-separated verified Instagram media IDs'
        required: false
        default: ''
        type: string
      confirm:
        description: 'publish only: VERIFIED_AND_CLEARED after review and permission check'
        required: false
        default: ''
        type: string

# This runs ONLY in YEONJI's repo, which already has IG_ACCESS_TOKEN and IG_USER_ID.
# GitHub's GITHUB_TOKEN is repository-scoped: results are exported as an artifact,
# not pushed into CHAEWON or exposed in YEONJI's public code.
permissions:
  contents: read

concurrency:
  group: chaewon-instagram-bridge
  cancel-in-progress: false

jobs:
  export:
    if: github.repository == 'bbangshion/yeonji-archive' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public CHAEWON source (not YEONJI source)
        uses: actions/checkout@v4
        with:
          repository: bbangshion/chaewon-archive
          ref: main
          path: chaewon
          persist-credentials: false

      - name: Prepare Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image support
        run: python -m pip install 'Pillow>=10.4,<13'

      - name: Check inputs and secrets without revealing values
        env:
          TOKEN_PRESENT: ${{ secrets.IG_ACCESS_TOKEN != '' }}
          USER_PRESENT: ${{ secrets.IG_USER_ID != '' }}
          MODE: ${{ inputs.mode }}
          MEDIA_IDS: ${{ inputs.media_ids }}
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          test "$TOKEN_PRESENT" = 'true' || { echo 'IG_ACCESS_TOKEN is not set in YEONJI Actions secrets'; exit 1; }
          test "$USER_PRESENT" = 'true' || { echo 'IG_USER_ID is not set in YEONJI Actions secrets'; exit 1; }
          test -f chaewon/scripts/sync-chaewon-official.py || { echo 'CHAEWON collector script missing'; exit 1; }
          if [ "$MODE" = 'publish' ]; then
            test -n "$MEDIA_IDS" || { echo 'Enter verified media_ids before publishing'; exit 1; }
            test "$CONFIRM" = 'VERIFIED_AND_CLEARED' || { echo 'Verify identification and photo rights first'; exit 1; }
          fi

      - name: Collect official CHAEWON candidates or export verified photos
        working-directory: chaewon
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_API_VERSION: v24.0
          MODE: ${{ inputs.mode }}
          MAX_PAGES: ${{ inputs.max_pages }}
          MEDIA_IDS: ${{ inputs.media_ids }}
          CONFIRM: ${{ inputs.confirm }}
        run: python scripts/sync-chaewon-official.py

      - name: Prepare safe transfer files (no API token)
        env:
          MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, shutil, subprocess, json
          src=pathlib.Path('chaewon')
          dst=pathlib.Path('transfer')
          report=src/'reports/chaewon-official-instagram-review.json'
          if not report.exists():
              raise SystemExit('Review report was not generated')
          target=dst/'reports/chaewon-official-instagram-review.json'
          target.parent.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(report, target)
          data=json.loads(report.read_text(encoding='utf-8'))
          print('Candidates:',data.get('candidateCount',0), '| newly published:',data.get('newPublishedCount',0))
          if os.environ['MODE']=='publish':
              src_photos=src/'public/data/photos.json'
              photo_target=dst/'public/data/photos.json'
              photo_target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(src_photos,photo_target)
              # Export only new photos, not any pre-existing repository assets.
              new_files=subprocess.check_output(
                  ['git','ls-files','--others','--exclude-standard','--','public/images/chaewon-official'],
                  cwd=src,text=True).splitlines()
              for name in new_files:
                  source=src/name
                  if not source.is_file() or source.is_symlink():
                      raise SystemExit('Unexpected media path')
                  destination=dst/name
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(source,destination)
              print('New local photos for transfer:',len(new_files))
          print('Transfer ready; no secrets are included.')
          PY

      - name: Upload transfer ZIP as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chaewon-official-${{ inputs.mode }}-${{ github.run_number }}
          path: transfer/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Next steps
        env:
          MODE: ${{ inputs.mode }}
        run: |
          {
            echo '### CHAEWON official Instagram export (using YEONJI Secrets)'
            echo '1. Open this run -> Artifacts -> download chaewon-official-${{ inputs.mode }}-${{ github.run_number }}.'
            if [ "$MODE" = discover ]; then
              echo '2. Review `reports/chaewon-official-instagram-review.json` for media IDs. This does NOT publish any photos.'
              echo '3. Re-run with mode=publish, verified media_ids and confirm=VERIFIED_AND_CLEARED.'
            else
              echo '2. Unzip the artifact; upload `public/data/photos.json` and new `public/images/chaewon-official/*.webp` into `bbangshion/chaewon-archive` at the same paths.'
              echo '3. Run Deploy CHAEWON ARCHIVE. No secret is transferred.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
