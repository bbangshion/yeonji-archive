name: Deploy YEONJI ARCHIVE

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Sync YEONJI SNS Gallery]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yeonji-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout YEONJI ARCHIVE
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test S12 converter
        run: node scripts/sync-wav-s12.mjs --self-test
      - name: Import verified S12 Objekts from WAV ARCHIVE
        run: node scripts/sync-wav-s12.mjs
      - name: Install dependencies (Rollup registry fix)
        shell: bash
        run: |
          set -euo pipefail
          # Pin the published Rollup version for this build only.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = '4.68.7';
          for (const section of ['dependencies', 'devDependencies', 'optionalDependencies']) {
            if (p[section] && Object.hasOwn(p[section], 'rollup')) p[section].rollup = version;
          }
          p.overrides = { ...p.overrides, rollup: version };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install --package-lock=false --prefer-online --include=optional --no-audit --no-fund
          node --input-type=module -e "import { VERSION } from 'rollup'; if (VERSION !== '4.68.7') throw new Error('Unexpected Rollup version: ' + VERSION); console.log('Verified Rollup ' + VERSION)"
      - name: Cache optimized World Cup artwork
        uses: actions/cache@v4
        with:
          path: public/objekt-poster
          key: ${{ runner.os }}-yeonji-poster-v1-${{ hashFiles('scripts/cache-objekt-poster.mjs') }}
      - name: Validate World Cup poster job
        run: node scripts/cache-objekt-poster.mjs --self-test
      - name: Prepare images for downloadable results
        run: node scripts/cache-objekt-poster.mjs
      - name: Audit S12 data isolation
        run: node scripts/audit-yeonji.mjs --ci
      - name: Build React/Vite site
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
