name: YEONJI Gallery - Social photo expansion
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'publish = apply approved images; discover = API search and publish approved images'
        type: choice
        options: [publish, discover]
        default: publish
        required: true
permissions:
  contents: write
concurrency:
  group: yeonji-photo-gallery-build
  cancel-in-progress: false
jobs:
  social-gallery:
    if: github.ref == 'refs/heads/main' && github.repository == 'bbangshion/yeonji-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image support
        run: python -m pip install 'Pillow>=10.4,<13'
      - name: Extend existing gallery data loader
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PATCH_PY'
          FALLBACK=''
          LOADER="  // YEONJI_UNIFIED_GALLERY_V2\n  const label = x => typeof x === 'string' ? x.trim() : x && typeof x === 'object' ? (x.ko || x.en || x.ja || '') : '';\n  function absoluteImage(value, base) {\n    if (typeof value !== 'string' || !value.trim()) return '';\n    try { const u=new URL(value,base);return ['http:','https:'].includes(u.protocol)&&!u.username&&!u.password?u.href:''; } catch {return '';}\n  }\n  function normalizedRows(payload,kind,pageURL=location.href) {\n    const rows=Array.isArray(payload)?payload:payload?.photos;\n    if(!Array.isArray(rows))throw new Error('Invalid photo list');\n    const local=kind==='gallery'||kind==='social';const base=new URL(local?'./':'../',pageURL);\n    return rows.flatMap(p=>{\n      if(!p||typeof p!=='object'||(p.memberId&&p.memberId!=='S12')||(p.category&&String(p.category).toLowerCase()!=='photo')||(p.type&&String(p.type).toLowerCase()!=='photo'))return [];\n      const status=String(p.status||p.reviewStatus||'').toLowerCase();\n      if(p.approved===false|| (local&&status!=='approved') || (!local&&status&&!['approved','published','verified'].includes(status)))return [];\n      const image=absoluteImage(p.image||p.imageUrl||p.src,base);if(!image||/\\/(?:objekt|objekt-collection)\\//i.test(new URL(image).pathname))return [];\n      const day=typeof p.date==='string'&&/^\\d{4}-\\d{2}-\\d{2}$/.test(p.date)?p.date:'';\n      const year=day?day.slice(0,4):/^20\\d{2}$/.test(String(p.sourceYear||p.year||''))?String(p.sourceYear||p.year):'';\n      const sourceUrl=[p.sourceUrl,p.permalink,p.source].find(x=>typeof x==='string'&&/^https?:\\/\\//i.test(x))||'';\n      return [{id:String(p.id||image),image,thumb:absoluteImage(p.thumb||p.thumbnail||p.thumbnailUrl,base)||image,date:day,year,sourceUrl,source:[label(p.source),label(p.album),p.sourceSection,sourceUrl,Array.isArray(p.tags)?p.tags.join(' '):''].filter(Boolean).join(' '),originalCreator:label(p.originalCreator||p.originalAuthor||p.author),title:label(p.title)||'곽연지',tags:Array.isArray(p.tags)?p.tags.filter(t=>typeof t==='string'):[],sha256:typeof p.sha256==='string'&&/^[a-f0-9]{64}$/i.test(p.sha256)?p.sha256.toLowerCase():'',width:Number(p.width)||0,height:Number(p.height)||0}];\n    });\n  }\n  function mergeRows(rows) {\n    const result=[], keys=new Map();\n    const photoURL = s => {const u=new URL(s);u.hash='';if(/(?:^|\\.)wikia\\.nocookie\\.net$/.test(u.hostname)){u.pathname=u.pathname.replace(/\\/revision\\/.*$/,'');u.search='';}return u.href;};\n    for(const p of rows){const ids=['id:'+p.id,'url:'+photoURL(p.image),...(p.sha256?['sha:'+p.sha256]:[])];const old=ids.map(k=>keys.get(k)).find(Boolean);if(old){for(const field of ['date','year','sourceUrl','originalCreator','sha256','width','height'])if(!old[field]&&p[field])old[field]=p[field];if(old.thumb===old.image&&p.thumb!==p.image)old.thumb=p.thumb;old.tags=[...new Set([...old.tags,...p.tags])];ids.forEach(k=>keys.set(k,old));}else{result.push(p);ids.forEach(k=>keys.set(k,p));}}\n    return result.sort((a,b)=>(b.date||b.year||'').localeCompare(a.date||a.year||'')||a.id.localeCompare(b.id));\n  }\n  async function start() {\n    const sources=[['./social_photos.json','social'],['./gallery_data.json','gallery'],['../data/photos.json','archive'],['../data/yeonji-sns.json','sns']];\n    const results=await Promise.allSettled(sources.map(async ([url,kind])=>{const r=await fetch(url,{cache:'no-cache'});if(!r.ok)throw new Error(url+' HTTP '+r.status);return normalizedRows(await r.json(),kind);}));\n    try{if(results.every(r=>r.status==='rejected'))throw new Error('Photo lists unavailable');photos=mergeRows(results.flatMap(r=>r.status==='fulfilled'?r.value:[]));const years=[...new Set(photos.map(p=>p.year).filter(Boolean))].sort().reverse();years.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y;$('#year').append(o);});applyFilters();if(results.slice(0,3).some(r=>r.status==='rejected')){const note=document.createElement('p');note.setAttribute('role','status');note.textContent='일부 사진 목록을 불러오지 못했습니다';note.style.color='var(--sub)';note.style.fontSize='12px';gallery.before(note);}}\n    catch(error){console.error(error);$('#total').textContent='LOAD ERROR';empty.hidden=false;empty.textContent='사진 데이터를 불러오지 못했습니다';}\n  }\n"
          from pathlib import Path
          import re,base64,os
          p=Path('public/gallery/index.html')
          # Preserve the installed template; only use original supplied template if missing.
          html=p.read_text(encoding='utf-8') if p.is_file() else base64.b64decode(FALLBACK).decode('utf-8')
          start=html.find('  // YEONJI_UNIFIED_GALLERY_V2')
          if start<0:start=html.find('  // YEONJI_UNIFIED_GALLERY_V1')
          if start<0:start=html.find('  async function start() {')
          end=html.find('  start();',start)
          if start<0 or end<0:raise SystemExit('Unrecognized existing gallery loader; no template changes made')
          html=html[:start]+LOADER+html[end:]
          html=html.replace("String(p.date || '').startsWith(year)","p.year === year")
          html=html.replace('dateDisplay(p.date)',"(p.date ? dateDisplay(p.date) : p.year ? `${p.year} · 날짜 미확인` : '날짜 미확인')") if 'p.year ? `${p.year}' not in html else html
          # Ensure both thumbnail and original are attempted, retaining original modal UI.
          old="img.addEventListener('error', () => {img.remove(); const note=document.createElement('div');note.className='image-failed';note.textContent='이미지를 불러오지 못했습니다';opener.append(note);},{once:true});"
          new="""img.addEventListener('error', () => { if (!img.dataset.retry && p.thumb && p.thumb !== p.image) {img.dataset.retry='1';img.src=imageURL(p.image);return;} img.remove();const note=document.createElement('div');note.className='image-failed';note.textContent='이미지를 불러오지 못했습니다';opener.append(note); });"""
          html=html.replace(old,new)
          html=html.replace("const href = safeURL(p.sourceUrl);", "const href = p.sourceUrl ? safeURL(p.sourceUrl) : '';")
          html=html.replace('/official|modhaus|concept/', '/official|modhaus|concept|공식|콘셉트|화보/')
          html=html.replace('/instagram|sns|twitter|x\\.com/', '/instagram|sns|twitter|x\\.com|인스타|트위터/')
          html=html.replace('/stage|fancam|concert|music|broadcast/', '/stage|fancam|concert|music|broadcast|무대|직캠|공연/')
          # allow hashtag queries whether stored with # or without
          if ".replace(/^#/, '')" not in html:html=html.replace("$('#search').value.trim().toLowerCase()", "$('#search').value.trim().toLowerCase().replace(/^#/, '')")
          if '.sr-only{' not in html and '.sr-only {' not in html:html=html.replace('</style>', '.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}\n</style>',1)
          p.parent.mkdir(parents=True,exist_ok=True);p.write_text(html,encoding='utf-8')
          blocks=re.findall(r'<script>([\s\S]*?)</script>',html)
          if len(blocks)!=1:raise SystemExit('Unexpected script count')
          Path('/tmp/yeonji-social-gallery-check.js').write_text(blocks[0],encoding='utf-8')
          PATCH_PY
          node --check /tmp/yeonji-social-gallery-check.js
      - name: Discover and publish cleared photo assets
        env:
          MODE: ${{ inputs.mode }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_API_VERSION: ${{ vars.IG_GRAPH_API_VERSION }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'SOCIAL_PY'
          from pathlib import Path
          import os, re, json, csv, hashlib, shutil, time, urllib.request, urllib.error, urllib.parse, datetime, io
          from PIL import Image, ImageOps
          ROOT=Path('.')
          G=Path('public/gallery'); REPORT=Path('reports/yeonji-gallery-social-review.json'); INBOX=Path('photo_sources/social_approved.json')
          TAGS=('연지','yeonji','곽연지','kwakyeonji')
          TAG_RE=re.compile(r'(?<!\w)#(연지|yeonji|곽연지|kwakyeonji)(?!\w)',re.I)
          GROUP=re.compile(r'(?<!\w)#?(triple\s*s|트리플에스|S12|곽연지|kwak\s*yeon\s*ji)(?!\w)',re.I)

          def read(p, default):
              return json.loads(p.read_text(encoding='utf-8')) if p.is_file() else default

          def write(p, data):
              p.parent.mkdir(parents=True,exist_ok=True)
              temp=p.with_suffix(p.suffix+'.tmp');temp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8');temp.replace(p)

          def rows(x):
              x=x.get('photos',[]) if isinstance(x,dict) else x
              if not isinstance(x,list): raise ValueError('Expected photo array')
              return x

          def https(x):
              try:
                  u=urllib.parse.urlsplit(x or '');return bool(u.scheme=='https' and u.hostname and not u.username and not u.password)
              except (ValueError,TypeError):return False

          def date(x):
              try: return datetime.date.fromisoformat(str(x)[:10]).isoformat()
              except ValueError: return None

          def tags(txt): return sorted({m.group(1).lower() for m in TAG_RE.finditer(txt or '')})

          def request_json(host,path,params,token):
              url='https://'+host+'/'+path.lstrip('/')+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json','User-Agent':'YEONJI-Archive/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r: return json.loads(r.read(8_000_000))
              except urllib.error.HTTPError as e: raise RuntimeError(f'{host} HTTP {e.code}') from None
              except Exception as e: raise RuntimeError(f'{host}: {type(e).__name__}') from None

          def candidate(platform,post,media,src,caption,when,official=False,found=()):
              if not https(src):return None
              # The hashtag endpoint itself establishes a match even if caption is absent.
              t=sorted(set(tags(caption))|set(found))
              if not t and not (official and GROUP.search(caption or '') and re.search(r'곽연지|(?<!\w)연지(?!\w)|yeonji|S12',caption or '',re.I)):return None
              return {'id':platform+':'+str(media or post),'platform':platform,'postId':str(post),'mediaId':str(media or post),'sourceUrl':src,'date':date(when),'tags':t,'official':official,'groupHint':bool(official or GROUP.search(caption or '')),'status':'pending'}

          def instagram(token,user,version,limit=2):
              host='graph.facebook.com';out=[];errors=[]
              if not re.fullmatch(r'v\d+\.\d+',version):return [],['Invalid API version']
              def call(p,params):return request_json(host,version+'/'+p,params,token)
              def collect(post,official=False,found=()):
                  kind=post.get('media_type'); cap=post.get('caption') or ''
                  if kind not in ('IMAGE','CAROUSEL_ALBUM'):return
                  if kind=='CAROUSEL_ALBUM':
                      children=post.get('children',{}).get('data',[])
                      images=[p for p in children if p.get('media_type')=='IMAGE']
                      # If children unavailable, preserve post for manual photo import, not a pretend photo.
                      if not children:images=[{}]
                  else:images=[post]
                  for p in images:
                      c=candidate('instagram',post.get('id'),p.get('id'),post.get('permalink'),cap,post.get('timestamp'),official,found)
                      if c:out.append(c)
              def pages(first, fetch_next, handler):
                  data=first
                  for _ in range(limit):
                      for post in data.get('data',[]):handler(post)
                      cursor=data.get('paging',{}).get('cursors',{}).get('after')
                      if not cursor or not data.get('paging',{}).get('next'):break
                      time.sleep(1);data=fetch_next(cursor)
              for tag in TAGS:
                  try:
                      hit=call('ig_hashtag_search',{'user_id':user,'q':tag}).get('data',[])
                      if not hit:continue
                      for edge in ('recent_media','top_media'):
                          params={'user_id':user,'fields':'id,caption,media_type,permalink,timestamp,children{id,media_type}','limit':50}
                          # Some approved app scopes do not expose children on hashtag media.
                          def fetch(cursor=None):
                              q=dict(params)
                              if cursor:q['after']=cursor
                              try:return call(str(hit[0]['id'])+'/'+edge,q)
                              except RuntimeError as e:
                                  if 'HTTP 400' not in str(e):raise
                                  q['fields']='id,caption,media_type,permalink,timestamp';return call(str(hit[0]['id'])+'/'+edge,q)
                          pages(fetch(),fetch,lambda p:collect(p,found=(tag,)))
                          time.sleep(1)
                  except RuntimeError as e:
                      errors.append(tag+': '+str(e))
                      if any('HTTP '+s in str(e) for s in ('401','403','429')):break
              # Business Discovery for official public professional account; limited by app access.
              try:
                  account=os.getenv('IG_OFFICIAL_ACCOUNT','triplescosmos');
                  if not re.fullmatch(r'[a-zA-Z0-9_.]+',account):raise RuntimeError('Invalid official account')
                  def official_page(cursor=None):
                      if cursor and not re.fullmatch(r'[A-Za-z0-9_\-+=/]+',cursor):raise RuntimeError('Unexpected cursor')
                      after='.after('+cursor+')' if cursor else ''
                      field=f'business_discovery.username({account}){{media.limit(50){after}{{id,caption,media_type,permalink,timestamp,children{{id,media_type}}}}}}'
                      return call(user,{'fields':field}).get('business_discovery',{}).get('media',{})
                  pages(official_page(),official_page,lambda p:collect(p,True))
              except RuntimeError as e:errors.append('official: '+str(e))
              return out,errors

          def x_scan(token,limit=2):
              out=[];errors=[];cursor=None
              query='(#연지 OR #yeonji OR #곽연지 OR #kwakyeonji) has:images -is:retweet'
              for _ in range(limit):
                  params={'query':query,'max_results':100,'tweet.fields':'created_at,attachments','expansions':'attachments.media_keys','media.fields':'type,url'}
                  if cursor:params['next_token']=cursor
                  try:d=request_json('api.x.com','2/tweets/search/recent',params,token)
                  except RuntimeError as e:errors.append(str(e));break
                  media={x['media_key']:x for x in d.get('includes',{}).get('media',[]) if x.get('type')=='photo'}
                  for p in d.get('data',[]):
                      for k in p.get('attachments',{}).get('media_keys',[]):
                          if k not in media:continue
                          c=candidate('x',p['id'],k,'https://x.com/i/web/status/'+p['id'],p.get('text',''),p.get('created_at'))
                          if c:out.append(c)
                  cursor=d.get('meta',{}).get('next_token');
                  if not cursor:break
                  time.sleep(1)
              return out,errors

          # Local images supplied by the owner (with permission), or direct HTTPS images
          # explicitly cleared for copying. Never scrape or download using account cookies.
          ALLOWED_HOSTS=('cdninstagram.com','fbcdn.net','pbs.twimg.com','wikia.nocookie.net','fandom.com')
          def allowed(url):
              if not https(url):return False
              h=urllib.parse.urlsplit(url).hostname.lower()
              return any(h==x or h.endswith('.'+x) for x in ALLOWED_HOSTS)
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  if not allowed(newurl):raise ValueError('Disallowed redirect')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)

          def asset(entry):
              if entry.get('file'):
                  base=Path('photo_sources').resolve();p=(base/entry['file']).resolve()
                  if not p.is_relative_to(base) or not p.is_file():raise ValueError('Missing local image')
                  if p.stat().st_size>20_000_000:raise ValueError('Image exceeds 20 MB')
                  return p.read_bytes()
              u=entry.get('imageUrl','')
              if not allowed(u):raise ValueError('Remote host not allowlisted; use local image file')
              req=urllib.request.Request(u,headers={'User-Agent':'YEONJI-Archive/1.0','Accept':'image/*'})
              with urllib.request.build_opener(SafeRedirect()).open(req,timeout=25) as r:
                  if not r.headers.get_content_type().startswith('image/'):raise ValueError('Not image response')
                  data=r.read(20_000_001)
              if len(data)>20_000_000:raise ValueError('Image exceeds 20 MB')
              return data

          def publish(entries,existing):
              byhash={p.get('sha256') for p in existing if p.get('sha256')};byid={p.get('id') for p in existing};sourcekeys={(p.get('sourceUrl'),p.get('mediaId')) for p in existing if p.get('mediaId')};out=list(existing);errors=[];added=0;dup=0
              for e in entries:
                  if not isinstance(e,dict) or not all(e.get(k) is True for k in ('approved','memberVerified','rightsConfirmed')):continue
                  src=e.get('sourceUrl'); day=date(e.get('date'))
                  if not https(src) or not day or not e.get('author') or not isinstance(e.get('tags'),list) or not any(str(t).lstrip('#').casefold() in TAGS for t in e['tags']):errors.append('Missing source/date/author/tags');continue
                  mid=str(e.get('mediaId') or '')
                  if mid and (src,mid) in sourcekeys:dup+=1;continue
                  try:
                      b=asset(e);h=hashlib.sha256(b).hexdigest();id='yj-social-'+h[:32]
                      if h in byhash or id in byid:dup+=1;continue
                      with Image.open(io.BytesIO(b)) as check:check.verify()
                      with Image.open(io.BytesIO(b)) as im:
                          ext={'JPEG':'jpg','PNG':'png','WEBP':'webp'}.get(im.format)
                          if not ext:raise ValueError('Unsupported image type')
                          pic=ImageOps.exif_transpose(im);w,z=pic.size
                          if min(w,z)<64:raise ValueError('Image too small')
                          pic.thumbnail((750,1050));pic=pic.convert('RGB')
                          original=G/'assets/social'/f'{h}.{ext}'; thumb=G/'assets/social'/f'{h}.thumb.webp';original.parent.mkdir(parents=True,exist_ok=True)
                          original.write_bytes(b);pic.save(thumb,'WEBP',quality=82)
                      p={'id':id,'memberId':'S12','status':'approved','category':'photo','image':original.relative_to(G).as_posix(),'thumb':thumb.relative_to(G).as_posix(),'sha256':h,'date':day,'title':str(e.get('caption') or '곽연지'),'sourceUrl':src,'source':str(e.get('source') or 'SNS'),'originalCreator':str(e['author']),'tags':[str(t).lstrip('#') for t in e['tags']],'mediaId':mid,'width':w,'height':z,'curator':'빵시온'}
                      out.append(p);byhash.add(h);byid.add(id);sourcekeys.add((src,mid));added+=1
                  except Exception as ex:errors.append(f'{mid or "entry"}: {type(ex).__name__}')
              return out,added,dup,errors

          def main():
              mode=os.getenv('MODE','publish');G.mkdir(parents=True,exist_ok=True)
              if not INBOX.exists():write(INBOX,[])
              prior=rows(read(G/'social_photos.json',{'photos':[]}));entries=read(INBOX,[])
              if not isinstance(entries,list):raise ValueError('social_approved.json must be array')
              # Preserve local galleries, only count existing approved photos for hash dedupe.
              base=rows(read(Path('public/data/photos.json'),[]));local=rows(read(G/'gallery_data.json',{'photos':[]}))
              combined=prior+[x for x in base+local if isinstance(x,dict) and x.get('memberId','S12')=='S12' and x.get('status','approved')=='approved' and x.get('sha256')]
              if mode=='discover':
                  old=read(REPORT,{}).get('candidates',[]);found=[];errors=[];configured=[]
                  if os.getenv('IG_ACCESS_TOKEN') and os.getenv('IG_USER_ID'):
                      configured.append('instagram');a,b=instagram(os.environ['IG_ACCESS_TOKEN'],os.environ['IG_USER_ID'],os.getenv('IG_GRAPH_API_VERSION') or 'v24.0');found+=a;errors+=b
                  if os.getenv('X_BEARER_TOKEN'):
                      configured.append('x');a,b=x_scan(os.environ['X_BEARER_TOKEN']);found+=a;errors+=b
                  if not configured:errors.append('No Instagram/X API credentials: no new discovery performed')
                  merged={p['id']:p for p in old if isinstance(p,dict) and p.get('id')}
                  for p in found:
                      if p['id'] in merged:p['tags']=sorted(set(p['tags'])|set(merged[p['id']].get('tags',[])))
                      merged[p['id']]=p
                  write(REPORT,{'coverage':'partial; photo candidates, not identity or rights verification','configured':configured,'errors':errors,'candidates':sorted(merged.values(),key=lambda p:p.get('date') or '',reverse=True)})
                  print(f'Discovery: {len(found)} returned, {len(merged)} stored, {len(errors)} API issues')
                  if os.getenv('GITHUB_STEP_SUMMARY'):
                      with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(f'\nAPI candidates: {len(found)} returned / {len(merged)} total; issues: {len(errors)}. See reports/yeonji-gallery-social-review.json.\n')
              allrows,n,d,err=publish(entries,combined)
              # Only save prior social entries and newly added rows, not base photos.
              result=prior+allrows[len(combined):]
              write(G/'social_photos.json',{'schemaVersion':1,'photos':result})
              print(f'Published social: {len(result)}; new: {n}; duplicates: {d}; failures: {len(err)}')
              write(Path('reports/yeonji-social-publish.json'),{'published':len(result),'added':n,'duplicates':d,'errors':err,'legacyPhotoRows':len(base),'localGalleryRows':len(local)})
              if os.getenv('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(f'\nSocial photo records: {len(result)}; new: {n}; duplicate: {d}; failed: {len(err)}. Existing PHOTO rows: {len(base)}. Deploy manually after success.\n')
          if __name__=='__main__': main()
          SOCIAL_PY
      - name: Commit only gallery assets and review records
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/gallery/index.html public/gallery/social_photos.json photo_sources/social_approved.json reports/yeonji-social-publish.json
          for p in public/gallery/assets/social reports/yeonji-gallery-social-review.json; do
            if [ -e "$p" ]; then git add -- "$p"; fi
          done
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'data: extend YEONJI social gallery'; git push; fi
