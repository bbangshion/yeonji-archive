name: Install YEONJI ARCHIVE (once)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply YEONJI migration and keep SHION source untouched
        run: node YEONJI_INSTALL.mjs
      - name: Check S12 isolation
        run: |
          node scripts/sync-wav-s12.mjs --self-test
          node scripts/import-yeonji-fandom.mjs --self-test
          node scripts/audit-yeonji.mjs --ci
      - name: Commit migration without changing GitHub workflow files
        run: |
          # GitHub Actions GITHUB_TOKEN cannot create, update, or delete workflow files.
          # Preserve workflows already committed by the repository owner.
          git restore --source=HEAD --staged --worktree -- .github/workflows/
          git clean -fd -- .github/workflows/
          rm -f YEONJI_INSTALL.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'feat: launch YEONJI ARCHIVE with S12-only modules'
            git push origin HEAD:main
          fi
