name: Sync YEONJI Main Gallery Photos

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yeonji-main-gallery
  cancel-in-progress: false

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest YEONJI ARCHIVE
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check main gallery parser
        run: node scripts/import-yeonji-gallery.mjs --self-test
      - name: Sync still-photo metadata only
        shell: bash
        run: |
          if [[ -s public/data/yeonji-gallery-source.wiki ]]; then
            node scripts/import-yeonji-gallery.mjs --input public/data/yeonji-gallery-source.wiki --strict
          else
            node scripts/import-yeonji-gallery.mjs --strict
          fi
      - name: Check S12-only data integrity
        run: node scripts/audit-yeonji.mjs --ci
      - name: Save imported gallery photo metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/photos.json public/data/yeonji-gallery.json public/data/yeonji-gallery-sync.json
          if git diff --cached --quiet; then
            echo 'Gallery index unchanged'
          else
            git commit -m 'data: add YeonJi main gallery photo references'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Show imported image counts
        if: always()
        shell: bash
        run: |
          echo '### YEONJI main gallery import' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f public/data/yeonji-gallery-sync.json ]]; then
            node -e "const r=require('./public/data/yeonji-gallery-sync.json'); for(const k of ['status','sourceRows','matchedImages','added','total','error'])if(r[k]!==undefined)console.log('- '+k+': '+r[k]);" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
