          YEONJI_SYNC_SCRIPT
          test -s public/data/photos.json || printf '[]\n' > public/data/photos.json
          test -s public/data/yeonji-social-inbox.json || printf '[]\n' > public/data/yeonji-social-inbox.json
          node scripts/sync-yeonji-ig-official.mjs --self-test

      - name: Sync existing member-only Fandom SNS gallery when available
        shell: bash
        run: |
          if [ -f scripts/import-yeonji-fandom.mjs ]; then
            node scripts/import-yeonji-fandom.mjs || echo 'Fandom SNS unavailable; existing data preserved'
          else
            echo 'SNS importer absent; skip'
          fi

      - name: Sync existing member-only Fandom main gallery when available
        shell: bash
        run: |
          if [ -f scripts/import-yeonji-gallery.mjs ]; then
            node scripts/import-yeonji-gallery.mjs || echo 'Fandom main gallery unavailable; existing data preserved'
          else
            echo 'Main gallery importer absent; skip'
          fi

      - name: Index official Instagram and #연지 candidate posts; import approved S12 photos
        shell: bash
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_API_VERSION: v24.0
        run: node scripts/sync-yeonji-ig-official.mjs

      - name: Validate photo database without npm
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('public/data/photos.json','utf8'));
          const list=Array.isArray(p)?p:p.photos;
          if(!Array.isArray(list))throw Error('Invalid photos.json structure');
          for(const row of list){if(row.memberId&&row.memberId!=='S12')throw Error('Non-S12 photo: '+row.id);}
          const ids=list.map(x=>x.id);if(new Set(ids).size!==ids.length)throw Error('Duplicate IDs');
          console.log('S12 PHOTO VALIDATED, total:',list.length);
          NODE

      - name: Commit photo metadata and report only (no workflow edits)
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in scripts/sync-yeonji-ig-official.mjs \
            public/data/photos.json \
            public/data/yeonji-social-inbox.json \
            public/data/yeonji-social-candidates.json \
            public/data/yeonji-social-audit.json \
            public/data/yeonji-fandom-sync.json \
            public/data/yeonji-gallery-sync.json \
            public/data/yeonji-gallery.json \
            public/data/yeonji-sns.json; do
            if test -f "$file"; then git add -- "$file"; fi
          done
          if git diff --cached --quiet; then
            echo 'No new source metadata or photo records'
          else
            git commit -m 'data: reconcile S12 official and Instagram photo candidates'
            git push
          fi
