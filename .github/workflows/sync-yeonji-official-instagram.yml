name: Sync YEONJI Photos — Official + Instagram hashtag review

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * 1'

permissions:
  contents: write

concurrency:
  group: yeonji-social-photo-import
  cancel-in-progress: false

jobs:
  photo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout YEONJI ARCHIVE
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Node.js (no npm cache / lockfile required)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install scoped photo sync script
