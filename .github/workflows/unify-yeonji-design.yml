name: YEONJI - Unified Archive Family Design V1
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview: check only / apply: update, build and deploy'
        type: choice
        required: true
        default: preview
        options:
          - preview
          - apply
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: archive-family-yeonji
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'bbangshion' && contains(github.event.repository.name, 'yeonji')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Apply shared visual language (no archive data edits)
        shell: bash
        run: |
          cat > /tmp/archive-family-template.css <<'ARCHIVE_FAMILY_CSS'
          /* ARCHIVE FAMILY 01 — shared editorial UI for SHION / YEONJI / CHAEWON.
             Same components, same spacing and motion. Only --af-accent and portraits differ.
             Import this file LAST. This is a CSS overlay, NOT a reimplementation of features.
          */
          :root {
            --af-bg: #101014;
            --af-hero-bg: #0b0b0e;
            --af-surface: #18171d;
            --af-raised: #211f27;
            --af-line: rgba(255, 255, 255, .125);
            --af-ink: #f6f3f5;
            --af-muted: #aea9b2;
            --af-header-h: 76px;
            --af-width: 1180px;
            --af-radius: 4px;
            --af-ease: cubic-bezier(.25, 1, .5, 1);
            --af-motion: 240ms;
          }
          html { scroll-padding-top: var(--af-header-h); }
          body { background: var(--af-bg); color: var(--af-ink); font-family: Inter, Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
          .shion-site-header { height: var(--af-header-h); background: rgba(11, 11, 14, .94); border-bottom: 1px solid var(--af-line); }
          .shion-site-header.on-home { background: rgba(11, 11, 14, .78); }
          .shion-header-inner, .shion-content-width { width: min(calc(100% - 48px), var(--af-width)); margin-inline: auto; }
          .shion-header-inner { gap: 20px; }
          .shion-brand { gap: 12px; min-width: 0; min-height: 44px; }
          .shion-brand-mark { width: 36px; height: 36px; flex: 0 0 36px; border: 1px solid var(--af-accent); color: var(--af-accent); border-radius: 50%; font: 400 25px/1 Georgia, 'Times New Roman', serif; }
          .shion-brand-name { font-size: 12px; font-weight: 650; letter-spacing: .13em; }
          .shion-desktop-nav { gap: clamp(15px, 2.4vw, 29px); }
          .shion-desktop-nav button { font-size: 12px; font-weight: 550; letter-spacing: .03em; }
          .shion-desktop-nav button.is-active { border-bottom-color: var(--af-accent); }
          .shion-header-right { gap: 10px; }
          .shion-header-tag { color: var(--af-muted); font-size: 10px; }
          .shion-menu-toggle { width: 44px; height: 44px; flex: 0 0 44px; touch-action: manipulation; }
          .shion-mobile-menu { top: var(--af-header-h); background: #15141a; border-bottom: 1px solid var(--af-line); }
          .shion-mobile-link { min-height: 61px; font-size: 22px; }
          .shion-mobile-link.is-active { color: var(--af-accent); }
          .shion-subpage { padding-top: calc(var(--af-header-h) + 38px); background: var(--af-bg); }
          .shion-hero { background: var(--af-hero-bg); }
          .shion-hero-inner { width: min(calc(100% - 64px), var(--af-width)); }
          .shion-hero-copy h1 { font-weight: 540; letter-spacing: -.085em; }
          .shion-hero-overline, .shion-section-eyebrow, .shion-page-kicker { letter-spacing: .18em; font-weight: 600; }
          .shion-hero-primary, .shion-hero-secondary { min-height: 46px; border-radius: var(--af-radius); }
          .shion-home-explore, .shion-overview { background: var(--af-bg); }
          .shion-section-lead h2, .shion-page-heading h1 { letter-spacing: -.045em; }
          .shion-feature-card, .shion-source-card { border-radius: var(--af-radius); }
          .shion-profile-portrait img { border-radius: var(--af-radius); }
          .shion-photo-controls, .shion-film-controls, .shion-search-box, .shion-timeline-controls { background: var(--af-surface); border: 1px solid var(--af-line); border-radius: var(--af-radius); }
          .shion-photo-tabs button, .shion-film-tabs button { min-height: 42px; border-radius: var(--af-radius); transition: color var(--af-motion) var(--af-ease), background-color var(--af-motion) var(--af-ease), border-color var(--af-motion) var(--af-ease); }
          .shion-photo-tabs button.is-active, .shion-film-tabs button.is-active { background: var(--af-accent); border-color: var(--af-accent); color: #17131a; }
          .shion-photo-filters input, .shion-photo-filters select, .shion-film-search input, .shion-film-year select { border-radius: var(--af-radius); background: var(--af-raised); min-height: 44px; }
          .shion-photo-grid { gap: 23px 13px; }
          .shion-film-grid { gap: 30px 16px; }
          .shion-gallery-image { border-radius: var(--af-radius); background: var(--af-raised); }
          .shion-gallery-image img { display: block; width: 100%; height: 100%; }
          .shion-film-poster { border-radius: var(--af-radius); background: var(--af-raised); }
          .shion-film-poster img { display: block; width: 100%; height: 100%; }
          .shion-gallery-meta strong, .shion-film-card-details strong { font-weight: 570; }
          .shion-photo-more, .shion-film-more button, .shion-timeline-more, .shion-search-more { min-height: 44px; border-radius: var(--af-radius); }
          .shion-film-save, .shion-film-dialog-close, .shion-lightbox-top button { min-width: 44px; min-height: 44px; touch-action: manipulation; }
          .shion-film-dialog, .shion-film-dialog-backdrop { overscroll-behavior: contain; }
          .shion-timeline-entry { border-color: var(--af-line); }
          .shion-podium-stage, .shion-top-four { border-radius: 8px; }
          .shion-footer { background: var(--af-hero-bg); border-top: 1px solid var(--af-line); }
          .shion-footer-inner { gap: 14px; font-size: 11px; }
          .shion-site-header :is(a,button):focus-visible,
          .shion-home :is(a,button):focus-visible,
          .shion-subpage :is(a,button,input,select):focus-visible,
          .shion-mobile-menu button:focus-visible { outline: 2px solid var(--af-accent); outline-offset: 3px; }
          @media (hover: none) {
            .shion-gallery-tile:hover .shion-gallery-image img,
            .shion-film-card-main:hover .shion-film-poster img { transform: none; }
          }
          @media (max-width: 1180px) { .shion-desktop-nav { gap: 14px; } .shion-header-tag { display: none; } }
          @media (max-width: 900px) { .shion-desktop-nav { display: none; } .shion-menu-toggle { display: grid; } }
          @media (max-width: 760px) {
            :root { --af-header-h: 68px; }
            .shion-header-inner, .shion-content-width { width: min(calc(100% - 36px), var(--af-width)); }
            .shion-header-inner { gap: 10px; }
            .shion-header-right { gap: 7px; }
            .shion-brand { gap: 9px; flex: 1 1 auto; overflow: hidden; }
            .shion-brand-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: clamp(10px, 2.8vw, 12px); letter-spacing: .085em; }
            .shion-brand-mark { width: 34px; height: 34px; flex-basis: 34px; font-size: 23px; }
            .shion-hero-inner { width: min(calc(100% - 40px), var(--af-width)); }
            .shion-photo-controls, .shion-film-controls { padding: 14px; }
            .shion-photo-grid, .shion-film-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 10px; }
            .shion-film-dialog { max-height: calc(100dvh - 24px); }
            .shion-mobile-menu { padding-bottom: max(28px, env(safe-area-inset-bottom)); }
          }
          @media (max-width: 365px) {
            .shion-header-inner { width: calc(100% - 24px); }
            .shion-brand-name { font-size: 10px; letter-spacing: .045em; }
            .shion-film-search-row { grid-template-columns: minmax(0,1fr) 108px; }
          }
          @media (prefers-reduced-motion: reduce) {
            .shion-gallery-image img, .shion-film-poster img { transition: none !important; transform: none !important; }
          }
          ARCHIVE_FAMILY_CSS
          cat > /tmp/apply-archive-family.py <<'ARCHIVE_FAMILY_PY'
          #!/usr/bin/env python3
          """Safely apply shared visual language without modifying media or archive data.
          Usage: python apply_archive_family.py shion|yeonji|chaewon preview|apply
          """
          from pathlib import Path
          import re
          import sys

          SITE = {'shion': ('S','S20','#D7BBD7','SHION'),
                  'yeonji': ('Y','S12','#E3BED3','YEONJI'),
                  'chaewon': ('C','S21','#C7A3DF','CHAEWON')}
          if len(sys.argv) != 3 or sys.argv[1] not in SITE or sys.argv[2] not in ('preview', 'apply'):
              raise SystemExit('Usage: ... shion|yeonji|chaewon preview|apply')
          site, mode = sys.argv[1:]
          letter, sid, accent, title = SITE[site]
          root = Path.cwd()
          app = root / 'src/App.tsx'
          main = root / 'src/main.tsx'
          styles = root / 'src/index.css'
          # A wrong repo must fail closed. S21 site source can contain old S20 strings: check data marker.
          if not all(path.is_file() for path in (app, main, styles)):
              raise SystemExit('STOP: React/Vite site source missing (src/App.tsx, main.tsx, or index.css)')
          app_text = app.read_text(encoding='utf8')
          if 'shion-site-header' not in app_text or 'shion-brand-mark' not in app_text:
              raise SystemExit('STOP: unexpected header DOM structure; requires per-site review')
          main_text = main.read_text(encoding='utf8')
          if "import './index.css'" not in main_text and 'import "./index.css"' not in main_text:
              raise SystemExit('STOP: CSS entry structure changed; avoiding blind edit')

          # Only the displayed header monogram is changed, never media metadata, member names, or alt text.
          mark_re = re.compile(r'(<span\s+className=["\']shion-brand-mark["\'][^>]*>)([SYC])(<\/span>)')
          marks = list(mark_re.finditer(app_text))
          if len(marks) != 1:
              raise SystemExit(f'STOP: expected exactly 1 S/Y/C monogram, found {len(marks)}')
          new_app = mark_re.sub(lambda m: m[1]+letter+m[3], app_text, count=1)
          css_path = root / 'src/archive-family.css'
          base_css = Path('/tmp/archive-family-template.css')
          if not base_css.is_file():
              raise SystemExit('STOP: common design template missing')
          css = base_css.read_text(encoding='utf8').replace('/* ARCHIVE FAMILY 01', f'/* {title} / ARCHIVE FAMILY 01', 1)
          css = f':root {{ --af-accent: {accent}; }}\n' + css

          # Preserve any previously appended specialized overrides; import common tokens as final CSS layer.
          import_line = "import './archive-family.css';"
          if import_line not in main_text:
              css_imports = list(re.finditer(r"^import\s+['\"][^'\"]+\.css['\"];?\s*$", main_text, re.M))
              if not css_imports:
                  raise SystemExit('STOP: did not locate a CSS import insertion anchor')
              anchor = css_imports[-1].end()
              new_main = main_text[:anchor] + '\n' + import_line + main_text[anchor:]
          else:
              new_main = main_text

          # Brand-matched favicon. Do not rewrite index.html metadata or preexisting icon assets.
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="{letter}">
          <rect width="64" height="64" rx="12" fill="#101014"/>
          <circle cx="32" cy="32" r="25" fill="none" stroke="{accent}" stroke-width="1.5"/>
          <text x="32" y="43" fill="{accent}" font-family="Georgia,serif" font-size="36" text-anchor="middle">{letter}</text>
          </svg>\n'''
          favicon = root / 'public/archive-family-mark.svg'
          index = root / 'index.html'
          index_text = index.read_text(encoding='utf8') if index.is_file() else ''
          if '</head>' not in index_text:
              raise SystemExit('STOP: HTML head missing')
          # Keep old icon files on disk, but remove old icon LINK tags so browsers use only the member mark.
          index_text = re.sub(r'''(?im)^[ \t]*<link\b(?=[^>]*\brel\s*=\s*[\"'](?:shortcut\s+)?icon[\"'])[^>]*>[ \t]*(?:\r?\n)?''', '', index_text)
          icon_line = '  <link rel="icon" type="image/svg+xml" href="%BASE_URL%archive-family-mark.svg" />'
          if icon_line not in index_text:
              index_text = index_text.replace('</head>', icon_line + '\n</head>', 1)

          payload = {app: new_app, main: new_main, css_path: css, favicon: svg, index: index_text}
          changed = [p for p,v in payload.items() if not p.is_file() or p.read_text(encoding='utf8') != v]
          print(f'Archive family: {title} {sid}, accent={accent}; mode={mode}')
          print('Planned changes:', ', '.join(str(p.relative_to(root)) for p in changed) or '(none)')
          print('Source media, collections, photos, films, objekts, timeline and other site data: untouched')
          if mode == 'apply':
              for p in changed:
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(payload[p], encoding='utf8')
              print('Applied successfully. Run production build before committing.')
          else:
              print('Preview only; no source files changed.')
          ARCHIVE_FAMILY_PY
          python /tmp/apply-archive-family.py yeonji "${{ inputs.mode }}"
      - name: Install Node
        if: inputs.mode == 'apply'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          if test -f package-lock.json; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Verify production build
        if: inputs.mode == 'apply'
        run: npm run build
      - name: Commit visual changes only
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/App.tsx src/main.tsx src/archive-family.css index.html public/archive-family-mark.svg
          git diff --cached --quiet && echo 'No visual changes to commit.' || {
            git commit -m 'design: unify archive family visual language'
            git push origin "HEAD:${{ github.ref_name }}"
          }
      - name: Configure Pages
        if: inputs.mode == 'apply'
        uses: actions/configure-pages@v5
      - name: Upload built site
        if: inputs.mode == 'apply'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: inputs.mode == 'apply' && github.ref == 'refs/heads/main' && github.repository_owner == 'bbangshion' && contains(github.event.repository.name, 'yeonji')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
