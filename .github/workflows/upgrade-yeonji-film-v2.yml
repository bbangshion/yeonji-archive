      - name: Merge three checked official SIGNAL references
        run: node scripts/merge-yeonji-confirmed.mjs
      - name: Run offline feed and review tests
        run: node --test tests/film-v2.test.mjs
      - name: Typecheck and bundle
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit Film-only code and reviewed catalog changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/YeonjiFilm.tsx src/components/yeonji-film.css src/lib/films.ts src/i18n/yeonji-film-messages.ts scripts/merge-yeonji-confirmed.mjs scripts/sync-yeonji-films.mjs scripts/review-yeonji-films.mjs tests/film-v2.test.mjs public/data/films.json
          if git diff --cached --quiet; then
            echo "No Film V2 changes to commit"
          else
            git commit -m "feat: expand YeonJi Film SIGNAL LIVE and behind review"
            git push
          fi
