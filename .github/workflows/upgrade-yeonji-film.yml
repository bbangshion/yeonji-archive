      - name: Test video data isolation
        run: |
          node scripts/audit-yeonji.mjs --ci
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('public/data/films.json'));
          if(a.items?.length !== 26) throw Error('Missing video items');
          if(new Set(a.items.map(x=>x.youtubeId)).size !== a.items.length) throw Error('Duplicate videos');
          for(const x of a.items) if(!x.memberIds.includes('S12')) throw Error('Non-S12 video included');
          console.log('Checked',a.items.length,'S12 videos.');
          NODE
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build archive
        run: npm run build
      - name: Commit upgraded video components and data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/YeonjiFilm.tsx src/components/yeonji-film.css src/lib/films.ts src/i18n/yeonji-film-messages.ts public/data/films.json public/data/films-seed.json
          if git diff --cached --quiet; then
            echo "Video upgrade already installed."
          else
            git commit -m "feat: curate S12 official videos and fancams"
            git push origin HEAD:main
          fi
