      - name: Audit and merge only reviewed photo candidates
        run: node scripts/audit-yeonji-photos-v4.mjs
      - name: Install dependencies and compile
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit verified photo data and UI only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            scripts/apply-yeonji-photo-v4.py \
            scripts/audit-yeonji-photos-v4.mjs \
            src/components/PhotoArchive.tsx \
            src/components/yeonji-photo-v4.css \
            public/data/photos.json \
            public/data/yeonji-photo-candidates.json \
            public/data/yeonji-photo-v4-report.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'feat: audited S12 photos and 2026 photo index'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
