      - name: Integrate new profile dossier without replacing existing page
        run: node scripts/install-yeonji-profile.mjs

      - name: Check profile data and repeat-safe installation
        shell: bash
        run: |
          node scripts/install-yeonji-profile.mjs
          node --test tests/yeonji-profile.test.mjs

      - name: Install project dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Typecheck and build before committing
        run: npm run build

      - name: Commit only PROFILE source changes (not any workflows)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/components/ProfilePage.tsx src/components/YeonjiProfileDepth.tsx src/components/yeonji-profile-depth.css public/data/yeonji-profile-details.json scripts/install-yeonji-profile.mjs tests/yeonji-profile.test.mjs
          if git diff --cached --quiet; then
            echo 'No changes to apply; profile already updated.'
          else
            git commit -m "feat: add sourced YEONJI editorial profile dossier"
            git push
          fi
