name: Upgrade YEONJI PROFILE

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upgrade-yeonji-profile
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current YEONJI ARCHIVE
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Ensure this is YEONJI repository and compatible ProfilePage
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os,pathlib
          repo=os.environ.get('GITHUB_REPOSITORY','')
          if repo.lower()!='bbangshion/yeonji-archive':
              raise SystemExit('Refusing to alter another repository: '+repo)
          f=pathlib.Path('src/components/ProfilePage.tsx')
          if not f.exists(): raise SystemExit('Missing src/components/ProfilePage.tsx')
          code=f.read_text(encoding='utf-8')
          if "import { ProfileHistory } from './ProfileHistory';" not in code or '<ProfileHistory />' not in code:
              raise SystemExit('ProfilePage anchors differ; stopped safely before writing.')
          if "['history',l.history]" not in code and "['dossier'," not in code:
              raise SystemExit('Profile navigation anchor differs; stopped safely.')
          print('YEONJI PROFILE compatible; continue.')
          PYCODE

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

