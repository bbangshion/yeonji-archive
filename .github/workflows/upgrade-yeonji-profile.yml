          raw=base64.b64decode(''.join(encoded.split()))
          if hashlib.sha256(raw).hexdigest()!='0d79d486f0f649b4dd7f231fe31d78681f333df92a9bde498b7f86919416d770':
              raise SystemExit('Profile patch hash mismatch; existing files left unchanged')
