          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz') as t:
              names=[m.name for m in t.getmembers()]
              if sorted(names)!=sorted(allowed): raise SystemExit('Unexpected patch payload entries')
              for m in t.getmembers():
                  if not m.isfile(): raise SystemExit('Unsupported patch entry')
                  p=pathlib.Path(m.name)
                  if p.is_absolute() or '..' in p.parts: raise SystemExit('Unsafe archive path')
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(t.extractfile(m).read())
          print('Installed 5 additive S12 profile files')
