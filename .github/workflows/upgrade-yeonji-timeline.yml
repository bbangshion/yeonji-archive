      - name: Merge S12 activity records without removing other records
        run: node scripts/upgrade-yeonji-timeline.mjs

      - name: Verify dates, sources and activity categories
        run: node --test tests/yeonji-timeline.test.mjs

      - name: Install project dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund
          else
            npm install --ignore-scripts --no-audit --no-fund
          fi

      - name: Typecheck and build YEONJI ARCHIVE
        run: npm run build

      - name: Commit only timeline files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/components/TimelinePage.tsx src/components/yeonji-timeline-v3.css src/lib/activityCatalog.ts public/data/yeonji-timeline-seed.json scripts/upgrade-yeonji-timeline.mjs tests/yeonji-timeline.test.mjs public/data/yeonji-activities.json
          if git diff --cached --quiet; then
            echo 'No timeline changes to commit'
          else
