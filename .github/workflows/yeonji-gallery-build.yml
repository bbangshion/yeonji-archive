name: Build YEONJI Photo Gallery (local imports)

on:
  workflow_dispatch:
  push:
    paths:
      - 'photo_sources/**'
      - 'collector.py'
      - '.github/workflows/yeonji-gallery-build.yml'

permissions:
  contents: write

concurrency:
  group: yeonji-photo-gallery-build
  cancel-in-progress: false

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image processing dependency
        run: python -m pip install 'Pillow>=10.4,<13'

      - name: Check input files
        shell: bash
        run: |
          set -euo pipefail
          test -f collector.py || { echo '::error::Missing collector.py at repository root'; exit 1; }
          test -f photo_sources/manifest.csv || { echo '::error::Missing photo_sources/manifest.csv'; exit 1; }
          test -f public/gallery/index.html || { echo '::error::Missing public/gallery/index.html'; exit 1; }

      - name: Generate gallery JSON and thumbnails
        run: |
          python collector.py build
          python collector.py status

      - name: Append approved photos to existing PHOTO data where compatible
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f public/data/photos.json ]; then
            echo '::warning::public/data/photos.json missing; standalone gallery still generated, PHOTO sync skipped'
          elif python - <<'PY'
          import json
          try:
              with open('public/data/photos.json', encoding='utf-8') as f:
                  rows = json.load(f)
              assert isinstance(rows, list), 'PHOTO JSON must be a list'
          except Exception as exc:
              print(f'Existing PHOTO format cannot be safely synced: {exc}')
              raise SystemExit(1)
          PY
          then
            python collector.py sync-archive
          else
            echo '::warning::Existing PHOTO JSON shape differs; skipping to protect original data'
          fi

      - name: Show gallery counts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('public/gallery/gallery_data.json').read_text(encoding='utf-8'))
          rows = d.get('photos', [])
          published = [x for x in rows if x.get('status') == 'approved']
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(f'## YEONJI Gallery\n- Gallery entries: {len(rows)}\n- Approved: {len(published)}\n- Pending: {len(rows)-len(published)}\n')
              if not published:
                  out.write('- No approved photo available. Add images and approved manifest rows before expecting photos on the site.\n')
          PY

      - name: Commit generated gallery without editing workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/gallery/gallery_data.json
          if [ -d public/gallery/assets ]; then
            git add -A public/gallery/assets
          fi
          if [ -f public/data/photos.json ]; then
            git add public/data/photos.json
          fi
          if git diff --cached --quiet; then
            echo 'No gallery changes to commit'
          else
            git commit -m 'data: build YEONJI gallery [skip ci]'
            git push
          fi
